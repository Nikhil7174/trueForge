[project]
name = "trueforge-hackathon"
version = "0.1.0"
description = "Generic TrueForge integration template. First plugin: access-reviewer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "trueforge-sdk>=0.2.0",
  "mcp>=2.2.0",
  "uvicorn>=0.34.0",
  "starlette>=0.41.0",
]

[project.scripts]
tf-mcp = "trueforge_hackathon.agents.access_reviewer.mcp_server:main"
tf-seed = "trueforge_hackathon.cli.seed:main"
tf-run = "trueforge_hackathon.cli.run:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
